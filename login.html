<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول - أكاديمية الرياض للكاراتيه</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .login-card {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
      text-align: center;
    }

    .login-card h1 {
      margin: 0 0 10px;
      color: #111827;
      font-size: 25px;
    }

    .login-card p {
      color: #6b7280;
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: right;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      direction: ltr;
      text-align: left;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="login-card">

  <div class="logo">🥋</div>

  <h1>أكاديمية الرياض للكاراتيه</h1>

  <p>نظام إدارة الأكاديمية</p>

  <form id="loginForm">

    <label for="email">
      البريد الإلكتروني
    </label>

    <input
      type="email"
      id="email"
      placeholder="أدخل البريد الإلكتروني"
      required
      autocomplete="username"
    >

    <label for="password">
      كلمة المرور
    </label>

    <input
      type="password"
      id="password"
      placeholder="أدخل كلمة المرور"
      required
      autocomplete="current-password"
    >

    <button type="submit" id="loginButton">
      تسجيل الدخول
    </button>

  </form>

  <div id="message" class="message"></div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

  if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

  }


  loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    loginButton.disabled = true;

    loginButton.textContent =
      "جاري تسجيل الدخول...";

    message.style.display = "none";


    try {

      await auth.signInWithEmailAndPassword(
        email,
        password
      );


      showMessage(
        "تم تسجيل الدخول بنجاح ✅",
        "success"
      );


      setTimeout(() => {

        window.location.href = "index.html";

      }, 800);


    } catch (error) {

      console.error(error);

      let errorMessage =
        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      if (error.code === "auth/invalid-email") {

        errorMessage =
          "صيغة البريد الإلكتروني غير صحيحة.";

      } else if (
        error.code === "auth/too-many-requests"
      ) {

        errorMessage =
          "تمت محاولات كثيرة. حاول مرة أخرى لاحقًا.";

      }

      showMessage(
        errorMessage,
        "error"
      );


      loginButton.disabled = false;

      loginButton.textContent =
        "تسجيل الدخول";

    }

  });

</script>

</body>
</html>
